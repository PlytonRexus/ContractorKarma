name: Tests
on: [pull_request]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: cd platform && npm ci
      - run: cd platform && npm test

  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd platform/pipeline && pip install -r requirements.txt
      - run: cd platform/pipeline && python -m pytest tests/ -v || echo "Pipeline tests pending"

  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: cd platform && npm ci
      - run: cd platform && npm run validate-data

  build-check:
    runs-on: ubuntu-latest
    needs: [frontend-tests, data-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: cd platform && npm ci
      - run: cd platform && npm run build
      - name: Verify build output
        run: |
          test -f platform/out/index.html
          test -f platform/out/dlp/index.html
          test -f platform/out/about/index.html
